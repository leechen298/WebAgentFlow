<div class="layout">
  <div class="left-menu">
    <div class="menu-header">
      <span class="app-name">Admin Panel</span>
    </div>
    <div class="menu-list">
      <a href="/admin/dashboard" class="menu-item">
        <span class="menu-icon">📊</span>
        <span class="menu-text">Dashboard</span>
      </a>
      <a href="/admin/users" class="menu-item menu-item-active">
        <span class="menu-icon">👤</span>
        <span class="menu-text">Users</span>
      </a>
      <a href="/admin/orders" class="menu-item">
        <span class="menu-icon">📦</span>
        <span class="menu-text">Orders</span>
      </a>
      <a href="/admin/settings" class="menu-item">
        <span class="menu-icon">⚙️</span>
        <span class="menu-text">Settings</span>
      </a>
      <a href="/admin/reports" class="menu-item">
        <span class="menu-icon">📈</span>
        <span class="menu-text">Reports</span>
      </a>
    </div>
  </div>

  <div class="page-main" role="main">
    <div class="page-header">
      <h2>User Management</h2>
      <div class="header-actions">
        <button class="btn btn-primary" type="button">Add User</button>
        <button class="btn btn-default" type="button">Export</button>
      </div>
    </div>

    <div class="search-bar">
      <form class="search-form">
        <label for="search-input">Search users</label>
        <input type="text" id="search-input" name="keyword" placeholder="Search by name or email..." />
        <button type="submit" class="btn btn-search">Search</button>
      </form>
    </div>

    <div class="data-table-wrapper">
      <table class="data-table">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Alice Wang</td>
            <td>alice@example.com</td>
            <td>Admin</td>
            <td><span class="status-tag active">Active</span></td>
          </tr>
          <tr>
            <td>Bob Johnson</td>
            <td>bob@example.com</td>
            <td>Editor</td>
            <td><span class="status-tag active">Active</span></td>
          </tr>
          <tr>
            <td>Carol Li</td>
            <td>carol@example.com</td>
            <td>Viewer</td>
            <td><span class="status-tag inactive">Inactive</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="pagination">
      <span class="page-info">Showing 1-3 of 128 users</span>
      <button class="page-btn" disabled>Previous</button>
      <button class="page-btn">Next</button>
    </div>
  </div>
</div>
