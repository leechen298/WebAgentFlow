<!-- Complex nesting: form-item with sub-form, table with action columns -->
<main class="page-main">
  <h2>Order Management</h2>

  <!-- Scenario 1: form-item containing nested form controls -->
  <div class="el-form-item">
    <label class="el-form-item__label">Shipping Address</label>
    <div class="el-form-item__content">
      <input type="text" name="street" placeholder="Street" value="123 Main St" />
      <input type="text" name="city" placeholder="City" value="Beijing" />
      <select name="country">
        <option value="CN" selected>China</option>
        <option value="US">United States</option>
      </select>
      <input type="text" name="zip" placeholder="ZIP Code" />
    </div>
  </div>

  <!-- Scenario 2: form-item containing a table -->
  <div class="el-form-item">
    <label class="el-form-item__label">Order Items</label>
    <div class="el-form-item__content">
      <table class="order-table">
        <thead>
          <tr><th>Product</th><th>Qty</th><th>Price</th></tr>
        </thead>
        <tbody>
          <tr><td>Widget A</td><td>5</td><td>$10.00</td></tr>
          <tr><td>Widget B</td><td>2</td><td>$25.00</td></tr>
        </tbody>
      </table>
      <button type="button" class="btn-add">Add Item</button>
    </div>
  </div>

  <!-- Scenario 3: simple form-item (should remain a leaf) -->
  <div class="el-form-item">
    <label class="el-form-item__label">Notes</label>
    <div class="el-form-item__content">
      <textarea name="notes" placeholder="Optional notes"></textarea>
    </div>
  </div>

  <!-- Scenario 4: table with complex action cells -->
  <h3>User List</h3>
  <table class="user-table">
    <thead>
      <tr><th>Name</th><th>Email</th><th>Actions</th></tr>
    </thead>
    <tbody>
      <tr>
        <td>Alice</td>
        <td>alice@example.com</td>
        <td>
          <button type="button" class="btn-edit">Edit</button>
          <button type="button" class="btn-delete">Delete</button>
        </td>
      </tr>
      <tr>
        <td>Bob</td>
        <td>bob@example.com</td>
        <td>
          <button type="button" class="btn-edit">Edit</button>
          <button type="button" class="btn-delete">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Scenario 5: simple table (no complex cells, should use flat rows) -->
  <h3>Price List</h3>
  <table class="price-table">
    <thead>
      <tr><th>Item</th><th>Price</th><th>Stock</th></tr>
    </thead>
    <tbody>
      <tr><td>Apple</td><td>$1.50</td><td>100</td></tr>
      <tr><td>Banana</td><td>$0.75</td><td>250</td></tr>
      <tr><td>Cherry</td><td>$3.00</td><td>50</td></tr>
    </tbody>
  </table>
</main>
