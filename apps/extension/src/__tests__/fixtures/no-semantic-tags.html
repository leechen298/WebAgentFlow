<div class="top-bar">
  <div class="top-bar-logo">
    <span class="logo-icon">⚙</span>
    <span class="logo-name">MyApp</span>
  </div>
  <div class="top-bar-links">
    <a href="/home" class="top-link">Home</a>
    <a href="/profile" class="top-link">Profile</a>
    <a href="/settings" class="top-link current">Settings</a>
    <a href="/logout" class="top-link">Logout</a>
  </div>
</div>

<div class="content">
  <div class="page-title">
    <span class="title-text" style="font-size: 24px; font-weight: bold;">Settings</span>
    <span class="title-desc">Manage your account preferences</span>
  </div>

  <div class="form-area">
    <div class="form-row">
      <div class="form-label">
        <span>Username</span>
      </div>
      <div class="form-control">
        <input type="text" name="username" value="john_doe" class="input-field" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">
        <span>Email</span>
      </div>
      <div class="form-control">
        <input type="text" name="email" value="john@example.com" class="input-field" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">
        <span>Language</span>
      </div>
      <div class="form-control">
        <select name="language" class="select-field">
          <option value="en" selected>English</option>
          <option value="zh">Chinese</option>
          <option value="ja">Japanese</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">
        <span>Notifications</span>
      </div>
      <div class="form-control">
        <label class="checkbox-label">
          <input type="checkbox" name="notifications" checked />
          <span>Enable email notifications</span>
        </label>
      </div>
    </div>

    <div class="form-row">
      <div class="form-label">
        <span>Theme</span>
      </div>
      <div class="form-control">
        <label class="radio-label">
          <input type="radio" name="theme" value="light" checked />
          <span>Light</span>
        </label>
        <label class="radio-label">
          <input type="radio" name="theme" value="dark" />
          <span>Dark</span>
        </label>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-save">Save</button>
    <button type="button" class="btn-cancel">Cancel</button>
  </div>
</div>
