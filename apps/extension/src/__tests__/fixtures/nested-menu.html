<!-- Element UI-style admin page with nested sidebar menu + iframe -->
<div class="el-container">
  <aside class="el-aside" style="width: 240px;">
    <ul role="menubar" class="el-menu el-menu--vertical">
      <li role="menuitem" aria-haspopup="true" class="el-submenu is-opened" aria-expanded="true">
        <div class="el-submenu__title" style="padding-left: 20px;">
          <span>基本设置</span>
          <i class="el-submenu__icon-arrow el-icon-arrow-down"></i>
        </div>
        <ul role="menu" class="el-menu el-menu--inline">
          <div>
            <li role="menuitem" tabindex="-1" class="el-menu-item" style="padding-left: 40px;">
              <span class="name">职业标准配置列表</span>
            </li>
          </div>
          <div>
            <li role="menuitem" tabindex="-1" class="el-menu-item is-active" style="padding-left: 40px;">
              <span class="name">职业技能设置</span>
            </li>
          </div>
          <div>
            <li role="menuitem" tabindex="-1" class="el-menu-item" style="padding-left: 40px;">
              <span class="name">职业用工类型切换设置</span>
            </li>
          </div>
        </ul>
      </li>
      <li role="menuitem" aria-haspopup="true" class="el-submenu" aria-expanded="false">
        <div class="el-submenu__title" style="padding-left: 20px;">
          <span>高级设置</span>
          <i class="el-submenu__icon-arrow el-icon-arrow-down"></i>
        </div>
        <ul role="menu" class="el-menu el-menu--inline" style="display: none;">
          <div>
            <li role="menuitem" tabindex="-1" class="el-menu-item" style="padding-left: 40px;">
              <span class="name">权限管理</span>
            </li>
          </div>
        </ul>
      </li>
      <li role="menuitem" tabindex="-1" class="el-menu-item" style="padding-left: 20px;">
        <span class="name">系统日志</span>
      </li>
    </ul>
  </aside>

  <div class="el-container is-vertical">
    <header class="el-header">
      <nav class="breadcrumb">
        <a href="/">首页</a>
        <span>/</span>
        <a href="/settings">基本设置</a>
        <span>/</span>
        <span>职业技能设置</span>
      </nav>
    </header>

    <main class="el-main">
      <h2>职业技能设置</h2>
      <div class="el-form">
        <div class="el-form-item">
          <label class="el-form-item__label">技能名称</label>
          <div class="el-form-item__content">
            <input type="text" class="el-input__inner" placeholder="请输入技能名称" />
          </div>
        </div>
      </div>

      <h3>嵌入内容</h3>
      <iframe title="Skill Editor" src="about:blank" style="width: 100%; height: 400px; border: 1px solid #ddd;"></iframe>

      <div class="el-form-item__actions" style="margin-top: 20px;">
        <button type="button" class="el-button el-button--primary"><span>保存</span></button>
        <button type="button" class="el-button el-button--default"><span>取消</span></button>
      </div>
    </main>
  </div>
</div>
