[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-agent-flow-worker"
version = "0.1.0"
description = "WebAgentFlow worker service skeleton"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.10.1"
]

[project.optional-dependencies]
browser = [
  "playwright>=1.54.0"
]
dev = [
  "pytest>=8.4.1",
  "ruff>=0.12.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
