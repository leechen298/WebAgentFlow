prompt_id = "conversation_entry_gate"
version = "v1"
agent_role = "conversation_entry_gate"
schema_name = "ConversationEntryGateResult"
runtime_policy = "low_latency_relevance_gate"

allowed_inputs = [
  "current user message",
  "minimal conversation context",
]

