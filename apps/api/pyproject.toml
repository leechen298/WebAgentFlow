[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-agent-flow-api"
version = "0.1.0"
description = "WebAgentFlow FastAPI service skeleton"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16.4",
  "fastapi>=0.116.0",
  "pydantic-settings>=2.10.1",
  "psycopg[binary]>=3.2.9",
  "redis>=6.4.0",
  "sqlalchemy>=2.0.41",
  "uvicorn[standard]>=0.35.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.4.1",
  "ruff>=0.12.9"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
